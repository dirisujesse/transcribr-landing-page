name: Loader guard

# Fails if the loader planted in these repos in 2026 comes back: an auto-run
# VS Code task, code hidden far to the right of a line in a config file, a
# "font" that is really text, or the ignore rules it uses to hide itself. A
# failure here means the machine that pushed the commit is likely infected:
# stop, don't open the checkout in an editor, and clean that machine.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Look for the planted loader
        run: |
          set -u
          found=0
          # --include rules must come before --exclude, or grep scans every file.
          dirs=(--exclude-dir=.git --exclude-dir=node_modules)
          self=(--exclude=loader-guard.yml)

          echo "VS Code tasks that run when the folder opens:"
          grep -rIlE "${dirs[@]}" "${self[@]}" '"runOn"[[:space:]]*:[[:space:]]*"folderOpen"' . && found=1

          echo "The loader's markers or its blockchain lookups:"
          grep -rIlE "${dirs[@]}" "${self[@]}" "global[.]i *= *'|global\[.!.\] *= *'|blastapi[.]io|1rpc[.]io/eth" . && found=1

          echo "Code hidden after a long run of spaces or tabs:"
          grep -rIlE "${dirs[@]}" --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' --include='*.json' "${self[@]}" \
            '[[:space:]]{120,}[^[:space:]]' . && found=1

          echo "Font files that are really text, and the loader's renamed payload:"
          grep -rIl "${dirs[@]}" --include='*.woff' --include='*.woff2' --include='*.ttf' --include='*.otf' --include='*.eot' '.' . && found=1
          find . -path ./node_modules -prune -o \( -name '*.llf' -o -name branch_structure.json \) -print | grep . && found=1

          echo "Ignore rules that hide the loader's files:"
          grep -lE '^(temp_auto_push[.]bat|temp_interactive_push[.]bat|branch_structure[.]json|[.]gitignore)$' .gitignore 2>/dev/null && found=1

          if [ "$found" -eq 1 ]; then
            echo "::error::Planted loader found. Do not run or open this checkout in an editor; clean the machine that pushed it."
            exit 1
          fi
          echo "Clean."
